<li [class.producto-agotado]="producto().stock === 0"
    [class.producto-bajo]="producto().stock > 0 && producto().stock <= 15">
    <h3>{{ producto().nombre }}</h3>
    <p>Precio: {{ producto().precio | currency }}</p>
    <p>Stock: {{ producto().stock }}</p>
    @if (producto().stock === 0) {
    <p class="agotado">Sin stock</p>
    }
    <button (click)="onVender()">Vender 1</button>
    <button (click)="onEliminar()">Eliminar</button>
    <button (click)="onSeleccionar()">Vender cantidad</button>
</li>

<a [routerLink]="['/productos', producto().id]">Ver detalle</a>
